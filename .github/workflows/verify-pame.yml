name: Verify PAME application
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/verify-pame.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate discovery logic
        run: node --test tests/*.test.mjs
      - name: Build Next.js
        run: npm run build
